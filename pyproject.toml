[project]
name = "movie-pilot-lite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic~=1.16.0",
  "argon2-cffi~=25.1.0",
  "cryptography~=45.0.0",
  "fastapi~=0.116.0",
  "httpx~=0.28.0",
  "pydantic-settings~=2.10.0",
  "pymysql~=1.1.1",
  "qbittorrent-api~=2025.7.0",
  "sqlalchemy~=2.0.0",
  "tzdata~=2026.1",
  "uvicorn~=0.35.0",
]

[dependency-groups]
dev = [
  "pytest~=8.4.0",
  "pytest-asyncio~=1.1.0",
  "pytest-httpx~=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.uv]
package = false

